seed: 42
device: "cuda:0"

logging:
  path: ./runs/
  experiment: imdb_nc_p1c2_flat

data:
  path: ./data/preprocessed/IMDB_dhn_nc.pt

model:
  # Two-layer scalable DHN adaptation used by the heterogeneous benchmarks.
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
  homconv_kwargs:
    mapping_chunk_size: 100000
    checkpoint_chunks: true
  agg: null   # node classification: per-node logits, no graph-level pooling
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  epochs: 200
  loss:
    name: CrossEntropyLoss
    kwargs:
      reduction: mean
  optimizer:
    name: AdamW
    kwargs:
      lr: 0.005
      weight_decay: 0.001
      betas: [0.9, 0.999]
  lr_scheduling:
    name: null
    kwargs: {}
