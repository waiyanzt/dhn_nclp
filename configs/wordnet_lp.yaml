device: "cuda:0"

seeds: [1566911444, 20241017, 20251017]

model:
  in_dim: 64
  # Two rooted-edge layers provide a two-step receptive field without
  # explicitly materializing every p3 homomorphism.
  mapping_chunk_size: 100000
  checkpoint_chunks: true
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  epochs: 200
  patience: 10
  optimizer:
    name: Adam
    kwargs:
      lr: 0.001
      weight_decay: 0.0001
  neg_per_pos: 10

eval:
  hits_k: [1, 3, 10]
  eval_batch_size: 256
  # Match the lab WordNet table: one positive plus 50 deterministic corrupt
  # tails per query, logit threshold 0, and macro P/R/F1.
  binary_k: 50
  binary_rng_seed: 42

artifacts:
  save_best_checkpoint: true
  kendall:
    enabled: true
    num_candidates: 200
    candidate_rng_seed: 42
