device: "cuda:0"

seeds: [1566911444, 20241017, 20251017]

model:
  in_dim: 64
  # Bound p3 activation memory; checkpointing recomputes chunks in backward.
  mapping_chunk_size: 100000
  checkpoint_chunks: true
  # WordNet p3 is tractable, so use the vanilla DHN KG pattern set.
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
      p3: [-1, 64, 3]
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  epochs: 200
  patience: 10
  optimizer:
    name: Adam
    kwargs:
      lr: 0.001
      weight_decay: 0.0001
  neg_per_pos: 10

eval:
  hits_k: [1, 3, 10]
  eval_batch_size: 256
