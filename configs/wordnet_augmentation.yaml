device: "cuda:0"

seeds: [1566911444, 20241017, 20251017]

# This is the same DHN + DistMult architecture as configs/wordnet_lp.yaml.
model:
  in_dim: 64
  mapping_chunk_size: 100000
  checkpoint_chunks: true
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  super_epochs: 200
  eval_interval: 1
  patience: 10
  # Supervised triple batches reduce decoder/negative-sampling memory without
  # changing the model. Use 0 only if a whole augmented variant fits at once.
  batch_size: 65536
  neg_per_pos: 10
  grad_clip: 0.0
  optimizer:
    name: Adam
    kwargs:
      lr: 0.001
      weight_decay: 0.0001

eval:
  hits_k: [1, 3, 10]
  eval_batch_size: 256
  binary_k: 50
  binary_rng_seed: 42
