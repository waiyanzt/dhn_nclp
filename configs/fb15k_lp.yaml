device: "cuda:0"

seeds: [1566911444, 20241017, 20251017]

model:
  in_dim: 64
  # p3 DROPPED — 188M rows infeasible (see scripts/probe_fb15k_enumeration.py).
  # Two-layer {p1, c2}: output dim = 64+64 = 128 per layer -> final 128.
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  epochs: 200
  patience: 10
  optimizer:
    name: Adam
    kwargs:
      lr: 0.001
      weight_decay: 0.0001
  neg_per_pos: 10       # corrupt-tail negatives sampled per positive each epoch

eval:
  hits_k: [1, 3, 10]
  eval_batch_size: 256  # test triples per batch for full entity ranking
