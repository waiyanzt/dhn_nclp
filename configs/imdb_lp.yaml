device: "cuda:0"

# Seeds match Bishwash's RGCN-LP eval contract
seeds: [1566911444, 20241017, 20251017]

model:
  # nn.Embedding(num_nodes, in_dim) since LP runs with no input features
  in_dim: 64
  # Two-layer scalable DHN adaptation used by the heterogeneous benchmarks.
  layers_config:
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
    - p1: [-1, 64, 1]
      c2: [-1, 64, 2]
  homconv_kwargs:
    mapping_chunk_size: 100000
    checkpoint_chunks: true
  activation:
    name: ReLU
    kwargs:
      inplace: false

training:
  epochs: 200
  patience: 15        # val-BCE early stopping
  optimizer:
    name: AdamW
    kwargs:
      lr: 0.005
      weight_decay: 0.001
      betas: [0.9, 0.999]

eval:
  hits_k: [1, 3, 5]
  threshold: 0.5
